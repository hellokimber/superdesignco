<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>The Super Design Company sharing card</title>
  <style>
    @font-face {
      font-family: 'GT Walsheim Pro';
      src: url('../src/assets/fonts/GTWalsheimPro-Regular.woff2') format('woff2');
      font-weight: 400;
    }
    @font-face {
      font-family: 'GT Walsheim Pro';
      src: url('../src/assets/fonts/GTWalsheimPro-Bold.woff2') format('woff2');
      font-weight: 700;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body { background: #fff; color: #050505; font-family: 'GT Walsheim Pro', sans-serif; }
    main { padding: 48px 64px; }
    .logo { width: 132px; height: auto; display: block; }
    .headline { margin: 76px 0 24px; font-size: 104px; font-weight: 700; line-height: .98; letter-spacing: -4px; }
    .description { margin: 0; font-size: 29px; line-height: 1.25; }
    .domain { margin: 46px 0 0; font-size: 21px; color: #595959; }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../src/assets/super-logo/Super-black.svg" alt="The Super Design Company">
    <p class="headline">Stand out.<br>Launch fast.</p>
    <p class="description">Branding for pre-launch and early-stage startups.</p>
    <p class="domain">superdesigncompany.com</p>
  </main>
</body>
</html>
